<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Music Player Logo</title>
  <desc id="desc">A modern Music Player logo with a circular music-note play icon, sound wave bars, and the text Music Player.</desc>

  <defs>
    <linearGradient id="bluePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5FF"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#8B2CF5"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5FF"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#8B2CF5"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="#FFFFFF"/>

  <!-- Icon group -->
  <g transform="translate(75 55)" filter="url(#softShadow)">
    <!-- Outer ring -->
    <circle cx="195" cy="195" r="165" fill="none" stroke="url(#bluePurple)" stroke-width="18"/>

    <!-- Left equalizer bars -->
    <g fill="url(#bluePurple)">
      <rect x="44" y="171" width="16" height="48" rx="8"/>
      <rect x="73" y="151" width="16" height="88" rx="8"/>
      <rect x="102" y="125" width="16" height="140" rx="8"/>
      <rect x="131" y="165" width="16" height="60" rx="8"/>
    </g>

    <!-- Right equalizer bars -->
    <g fill="url(#bluePurple)">
      <rect x="243" y="177" width="16" height="36" rx="8"/>
      <rect x="272" y="158" width="16" height="74" rx="8"/>
      <rect x="301" y="137" width="16" height="116" rx="8"/>
      <rect x="330" y="165" width="16" height="60" rx="8"/>
    </g>

    <!-- Play button -->
    <path d="M140 132 C140 119 154 111 165 118 L248 174 C260 182 260 208 248 216 L165 272 C154 279 140 271 140 258 Z" fill="url(#bluePurple)"/>

    <!-- Music note -->
    <g fill="url(#bluePurple)">
      <ellipse cx="211" cy="257" rx="50" ry="36" transform="rotate(-12 211 257)"/>
      <rect x="251" y="93" width="22" height="160" rx="11"/>
      <path d="M261 94 C292 122 326 123 342 151 C355 174 342 202 323 213 C329 179 304 165 273 154 L273 94 Z"/>
    </g>
  </g>

  <!-- Brand text -->
  <g transform="translate(515 125)">
    <text x="0" y="95"
          font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
          font-size="105"
          font-weight="800"
          letter-spacing="-4"
          fill="#071833">Music</text>
    <text x="0" y="225"
          font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
          font-size="105"
          font-weight="800"
          letter-spacing="-4"
          fill="url(#textGradient)">Player</text>
  </g>
</svg>
