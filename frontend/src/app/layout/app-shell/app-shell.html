<a class="skip-link" href="#main-content">Skip to main content</a>

<div
  class="app-shell"
  [class.app-shell--sidebar-collapsed]="sidebarCollapsed()"
  [class.app-shell--sidebar-open]="sidebarDrawerOpen()"
  [class.app-shell--queue-open]="queueDrawerOpen()"
  [class.app-shell--sheet-open]="nowPlayingSheetOpen()"
>
  @if (sidebarDrawerOpen()) {
    <button
      class="scrim"
      type="button"
      aria-label="Close navigation"
      (click)="closeSidebar()"
    ></button>
  }

  <div
    #sidebarSlot
    class="sidebar-slot"
    [attr.role]="sidebarDrawerOpen() ? 'dialog' : null"
    [attr.aria-modal]="sidebarDrawerOpen() ? 'true' : null"
    [attr.aria-label]="sidebarDrawerOpen() ? 'Navigation menu' : null"
  >
    <app-glass-panel ariaLabel="Navigation sidebar">
      <app-sidebar
        [collapsed]="sidebarCollapsed() && !sidebarDrawerOpen()"
        [playlists]="playlistItems()"
        (closeRequested)="closeSidebar()"
      />
    </app-glass-panel>
  </div>

  <div class="main-column">
    <app-glass-panel class="toolbar-panel" ariaLabel="Search and toolbar">
      <app-top-search-bar
        (menuOpenRequested)="openSidebar()"
        (searchSubmitted)="onSearch($event)"
      />
    </app-glass-panel>

    <div class="content-row">
      <app-glass-panel class="main-panel" ariaLabel="Main content">
        <div id="main-content" tabindex="-1">
          <router-outlet />
        </div>
      </app-glass-panel>

      <div
        #queueSlot
        class="queue-slot"
        id="queue-drawer"
        [attr.role]="queueDrawerOpen() && isNarrowViewport() ? 'dialog' : null"
        [attr.aria-modal]="queueDrawerOpen() && isNarrowViewport() ? 'true' : null"
        [attr.aria-label]="queueDrawerOpen() && isNarrowViewport() ? 'Playback queue' : null"
      >
        @if (queueDrawerOpen()) {
          <button
            class="queue-scrim"
            type="button"
            aria-label="Close queue"
            (click)="closeQueue()"
          ></button>
        }

        <app-glass-panel class="queue-panel-shell" ariaLabel="Playback queue">
          <div class="queue-drawer-body">
            <div class="queue-drawer-toolbar">
              <div class="queue-sheet-handle" aria-hidden="true"></div>
              <p>Queue</p>
              <button
                #queueCloseButton
                class="close-queue"
                type="button"
                aria-label="Close queue"
                (click)="closeQueue()"
              >
                Close
              </button>
            </div>
            <app-queue-panel />
          </div>
        </app-glass-panel>
      </div>
    </div>
  </div>

  <div class="player-slot">
    <app-now-playing-bar />
  </div>

  <app-now-playing-sheet />
</div>
