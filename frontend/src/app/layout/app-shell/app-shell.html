<div
  class="app-shell"
  [class.app-shell--sidebar-collapsed]="sidebarCollapsed()"
  [class.app-shell--sidebar-open]="sidebarDrawerOpen()"
  [class.app-shell--queue-open]="queueDrawerOpen()"
>
  @if (sidebarDrawerOpen()) {
    <button
      class="scrim"
      type="button"
      aria-label="Close navigation"
      (click)="closeSidebar()"
    ></button>
  }

  <div class="sidebar-slot">
    <app-glass-panel ariaLabel="Navigation sidebar">
      <app-sidebar
        [collapsed]="sidebarCollapsed() && !sidebarDrawerOpen()"
        [playlists]="playlistItems()"
        (closeRequested)="closeSidebar()"
      />
    </app-glass-panel>
  </div>

  <div class="main-column">
    <app-glass-panel class="toolbar-panel" ariaLabel="Search and toolbar">
      <app-top-search-bar
        (menuOpenRequested)="openSidebar()"
        (searchSubmitted)="onSearch($event)"
      />
    </app-glass-panel>

    <div class="content-row">
      <app-glass-panel class="main-panel" ariaLabel="Main content">
        <router-outlet />
      </app-glass-panel>

      <div class="queue-slot" id="queue-drawer">
        @if (queueDrawerOpen()) {
          <button
            class="queue-scrim"
            type="button"
            aria-label="Close queue"
            (click)="closeQueue()"
          ></button>
        }

        <app-glass-panel class="queue-panel-shell" ariaLabel="Playback queue">
          <div class="queue-drawer-body">
            <div class="queue-drawer-toolbar">
              <p>Queue</p>
              <button
                #queueCloseButton
                class="close-queue"
                type="button"
                (click)="closeQueue()"
              >
                Close
              </button>
            </div>
            <app-queue-panel />
          </div>
        </app-glass-panel>
      </div>
    </div>
  </div>

  <div class="player-slot">
    <app-now-playing-bar />
  </div>
</div>
