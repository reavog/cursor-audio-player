<section class="auth-page" aria-labelledby="forgot-title">
  <div class="auth-card">
    <p class="auth-eyebrow">Account recovery</p>
    <h1 id="forgot-title">Forgot password</h1>
    <p class="auth-copy">
      Enter your username or email and we will issue a 6-character sign-in code.
    </p>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="forgot-identifier">Username or email</label>
        <input
          id="forgot-identifier"
          name="identifier"
          type="text"
          autocomplete="username"
          required
          [(ngModel)]="identifier"
        />
      </div>

      @if (error()) {
        <p class="auth-error" role="alert">
          <span class="material-symbols-outlined" aria-hidden="true">error</span>
          {{ error() }}
        </p>
      }

      @if (message()) {
        <p class="auth-success" role="status">
          <span class="material-symbols-outlined" aria-hidden="true">mail</span>
          {{ message() }}
        </p>
      }

      <button class="primary-button" type="submit" [disabled]="submitting()">
        <span class="material-symbols-outlined" aria-hidden="true">send</span>
        {{ submitting() ? "Sending..." : "Send code" }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Back to sign in</a>
      <a routerLink="/otp">I already have a code</a>
    </div>
  </div>
</section>
