<aside class="queue-panel" aria-labelledby="queue-title">
  <header class="queue-header">
    <div>
      <h2 id="queue-title">Queue</h2>
      <p class="meta">{{ queueCount() }} songs · {{ remainingLabel() }} remaining</p>
    </div>
    <app-icon-button
      icon="clear_all"
      label="Clear queue"
      variant="ghost"
      size="compact"
      [disabled]="queueCount() === 0"
      (pressed)="clearQueue()"
    />
  </header>

  @if (queueCount() === 0) {
    <app-empty-state
      icon="queue_music"
      title="Queue is empty"
      message="Play a song or use Play all to fill the upcoming list."
    />
  } @else {
    <ul class="queue-list" role="list">
      @for (row of rows(); track row.item.queueId) {
        <li
          class="queue-row"
          [class.is-active]="row.active"
          [class.is-dragging]="dragFromIndex() === row.index"
          [class.is-drop-target]="dropTargetIndex() === row.index && dragFromIndex() !== row.index"
          [attr.aria-current]="row.active ? 'true' : null"
          (dragover)="onDragOver(row.index, $event)"
          (drop)="onDrop(row.index, $event)"
        >
          <button
            class="drag-handle"
            type="button"
            draggable="true"
            aria-label="Drag to reorder"
            (dragstart)="onDragStart(row.index, $event)"
            (dragend)="onDragEnd()"
          >
            <span class="material-symbols-outlined" aria-hidden="true">drag_handle</span>
          </button>

          <button
            class="queue-item"
            type="button"
            (click)="playItem(row.item.queueId)"
          >
            @if (row.active) {
              <span class="now-playing-icon material-symbols-outlined" aria-hidden="true">graphic_eq</span>
            }
            <app-album-artwork
              size="sm"
              [title]="row.song?.title || 'Unknown song'"
              [artworkUrl]="row.song?.artworkUrl"
              [artworkColor]="row.song?.artworkColor"
            />
            <span class="queue-copy">
              <span class="title">{{ row.song?.title || "Unknown song" }}</span>
              <span class="artist">
                {{ row.song?.artist || "Unknown artist" }}
                <span class="dot" aria-hidden="true">·</span>
                <span class="duration">{{ formatSongDuration(row.song) }}</span>
              </span>
            </span>
          </button>

          <div class="queue-actions">
            <app-icon-button
              class="move-control"
              icon="keyboard_arrow_up"
              label="Move up in queue"
              variant="ghost"
              size="compact"
              [disabled]="row.index === 0"
              (pressed)="moveItem(row.index, -1, $event)"
            />
            <app-icon-button
              class="move-control"
              icon="keyboard_arrow_down"
              label="Move down in queue"
              variant="ghost"
              size="compact"
              [disabled]="row.index === queueCount() - 1"
              (pressed)="moveItem(row.index, 1, $event)"
            />
            <app-icon-button
              icon="close"
              label="Remove from queue"
              variant="ghost"
              size="compact"
              (pressed)="removeItem(row.item.queueId, $event)"
            />
          </div>
        </li>
      }
    </ul>
  }
</aside>
