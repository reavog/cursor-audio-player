spring:
  application:
    name: project

  datasource:
    url: jdbc:postgresql://localhost:5432/audioplayer
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

app:
  jwt:
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    expires-in: 604800
  mail:
    from: ${MAIL_FROM:noreply@localhost}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  otp:
    length: 6
    expires-in-seconds: 600

server:
  error:
    include-message: always
    include-binding-errors: always
